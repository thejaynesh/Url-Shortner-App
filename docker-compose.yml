version: '3.8'

services:
  mongodb:
    image: mongo:6-jammy
    container_name: url_shortener_db
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server-app
      dockerfile: Dockerfile
    container_name: url_shortener_api
    restart: unless-stopped
    environment:
      PORT: 5001
      CONNECTION_STRING: mongodb://mongodb:27017/urlshortener
    ports:
      - "5001:5001"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - app_network

  client:
    build:
      context: ./client-app
      dockerfile: Dockerfile
    container_name: url_shortener_ui
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - server
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  mongo_data:
    driver: local
