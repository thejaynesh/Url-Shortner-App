name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Configuration Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Server App (TypeScript)
        working-directory: ./server-app
        run: |
          npm install
          npm run build

      - name: Build Client App (React & Vite)
        working-directory: ./client-app
        run: |
          npm install
          npm run build

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config
